spring.application.name=ms-foro
server.port=8082

spring.datasource.url=jdbc:oracle:thin:@bdbiblioteca_low?TNS_ADMIN=D:/duoc/wallet
spring.datasource.username=MS_FORO
spring.datasource.password=${DB_PASSWORD_FORO}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

logging.level.ms.foro=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# URL del microservicio de usuarios
usuarios.service.url=http://localhost:8081